# Closing the lid suspends, then hibernates after HibernateDelaySec (see
# sleep.conf.d/30-hibernate-delay.conf), so a forgotten laptop never drains flat.
#
# HandleLidSwitchExternalPower is unset, so it follows this on AC too.
# HandleLidSwitchDocked stays at its default (ignore): with an external display
# connected, closing the lid is clamshell mode and does nothing. Omarchy's
# omarchy-system-lid-inhibit depends on that default.
[Login]
HandleLidSwitch=suspend-then-hibernate
